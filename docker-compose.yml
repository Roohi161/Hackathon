# Hackathon Central — Docker Compose
# Usage: docker compose up -d

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: hackathon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hackathon_user
      POSTGRES_PASSWORD: hackathon_pass
      POSTGRES_DB: hackathon_central
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon_user -d hackathon_central"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (optional, for sessions/caching)
  redis:
    image: redis:7-alpine
    container_name: hackathon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackathon-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://hackathon_user:hackathon_pass@db:5432/hackathon_central"
      JWT_SECRET: "${JWT_SECRET:-change-this-in-production-min-32-chars}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-change-this-refresh-secret-min-32-chars}"
      JWT_EXPIRATION: "15m"
      JWT_REFRESH_EXPIRATION: "7d"
      PORT: "5000"
      NODE_ENV: "production"
      CORS_ORIGIN: "http://localhost:3002"
      FRONTEND_URL: "http://localhost:3002"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Vite Frontend (dev only — use nginx for production)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: hackathon-web
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      VITE_API_URL: "http://localhost:5000/api/v1"
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
